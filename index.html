<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Palabra, galería de composiciones bíblicas de Cybergraphman.">
<title>Palabra | Cybergraphman</title>
<style>
:root{--bg:#faf9f6;--ink:#373630;--muted:#79766e;--line:#e6e1d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:0 30px}header{border-bottom:1px solid var(--line)}nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;font-weight:700;letter-spacing:.23em}.back{font-size:12px;color:var(--muted)}
.hero{padding:42px 0;border-bottom:1px solid var(--line)}.tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#948576}.hero h1{font:normal clamp(70px,13vw,150px)/1 Georgia,serif;letter-spacing:-.06em;margin:0 0 10px}.hero p{max-width:470px;font-size:15px;line-height:1.8;color:var(--muted)}.hero p.edition{font-family:Arial,Helvetica,sans-serif;font-style:normal;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#948576;line-height:1.8;margin:0}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:42px 0 28px}.bar h2{font:normal 29px Georgia,serif;margin:0}.bar span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-bottom:42px}.work img{width:100%;height:auto;display:block;background:#e4dfd7}.work h3{font:normal 21px Georgia,serif;margin:17px 0 7px}.work p{font-size:12px;color:var(--muted);margin:0}
.pending{aspect-ratio:9/16;border:1px solid var(--line);background:#f1eee9;display:grid;place-items:center;color:#a29b8f;font:20px Georgia,serif}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:12px}footer .wrap{display:flex;justify-content:space-between}
dialog{border:0;padding:0;background:transparent;max-width:min(90vw,760px);max-height:90vh}dialog img{max-width:100%;max-height:86vh;display:block}dialog::backdrop{background:rgba(17,16,14,.88)}button{cursor:pointer;border:0;background:transparent;padding:0;color:inherit}button img{cursor:zoom-in}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.hero{padding:30px 0}.bar{margin-top:30px}.grid{padding-bottom:30px}nav{height:64px}.wrap{padding:0 22px}}
</style>
<meta name="palabra-revision" content="una-obra-vertical-juan-5-20-v1" />
</head><body>
<header><div class="wrap"><nav><a class="brand" href="./">Cybergraphman</a><a class="back" href="https://github.com/Cybergraphman">Perfil de GitHub ↗</a></nav></div></header>
<main><section class="hero"><div class="wrap"><h1>Palabra</h1><p class="edition">Versículos · Reina-Valera 1960</p></div></section>
<section class="wrap"><div class="bar"><h2>Galería</h2><span>01 / Colección en desarrollo</span></div>
<div class="grid">
<article class="work"><button onclick="document.getElementById('imagen').showModal()" aria-label="Ampliar 1 Juan 5:20"><img src="1%20jn%205.20%20d.png" alt="Composición bíblica 1 Juan 5:20" loading="lazy"></button><h3>Vida eterna</h3><p>1 Juan 5:20</p></article>
<div class="pending">Próximamente</div><div class="pending">Próximamente</div></div></section></main>
<footer><div class="wrap"><span>© Cybergraphman</span><span>En colaboración con Mejía Martínez</span></div></footer>
<dialog id="imagen" onclick="this.close()"><img src="1%20jn%205.20%20d.png" alt="1 Juan 5:20"></dialog>
</body></html>
