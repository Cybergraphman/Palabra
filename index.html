<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Palabra, galería de composiciones bíblicas de Cybergraphman.">
<title>Palabra | Cybergraphman</title>
<style>
:root{--bg:#faf9f6;--ink:#373630;--muted:#79766e;--line:#e6e1d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:0 30px}header{border-bottom:1px solid var(--line)}nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;font-weight:700;letter-spacing:.23em}.back{font-size:12px;color:var(--muted)}
.hero{padding:90px 0 68px;border-bottom:1px solid var(--line)}.tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#948576}.hero h1{font:normal clamp(70px,13vw,150px)/1 Georgia,serif;letter-spacing:-.06em;margin:14px 0 20px}.hero p{max-width:470px;font-size:15px;line-height:1.8;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:56px 0 28px}.bar h2{font:normal 29px Georgia,serif;margin:0}.bar span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-bottom:100px}.work img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#e4dfd7}.work h3{font:normal 21px Georgia,serif;margin:17px 0 7px}.work p{font-size:12px;color:var(--muted);margin:0}
.pending{aspect-ratio:4/5;border:1px solid var(--line);background:#f1eee9;display:grid;place-items:center;color:#a29b8f;font:20px Georgia,serif}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:12px}footer .wrap{display:flex;justify-content:space-between}
dialog{border:0;padding:0;background:transparent;max-width:min(90vw,760px);max-height:90vh}dialog img{max-width:100%;max-height:86vh;display:block}dialog::backdrop{background:rgba(17,16,14,.88)}button{cursor:pointer;border:0;background:transparent;padding:0;color:inherit}button img{cursor:zoom-in}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.hero{padding:65px 0 48px}nav{height:64px}.wrap{padding:0 22px}}
</style>
</head><body>
<header><div class="wrap"><nav><a class="brand" href="./">CYBERGRAPHMAN / PALABRA</a><a class="back" href="https://github.com/Cybergraphman">Perfil de GitHub ↗</a></nav></div></header>
<main><section class="hero"><div class="wrap"><div class="tag">Colección de versículos</div><h1>Palabra.</h1><p class="edition"><cite>«Reina Valera 1960»</cite></p></div></section>
<section class="wrap"><div class="bar"><h2>Galería</h2><span>01 / Colección en desarrollo</span></div>
<div class="grid"><article class="work"><button onclick="document.getElementById('imagen').showModal()" aria-label="Ampliar Juan 6:47"><img src="assets/juan-6-47.png" alt="Composición bíblica Juan 6:47" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=&quot;pending&quot;>Juan 6:47<br>Imagen pendiente</div>')"></button><h3>El que cree en mí</h3><p>Juan 6:47 · Diseño editorial</p></article>
<div class="pending">Próximamente</div><div class="pending">Próximamente</div></div></section></main>
<footer><div class="wrap"><span>© Cybergraphman · Palabra</span><span>Arte y tipografía</span></div></footer>
<dialog id="imagen" onclick="this.close()"><img src="assets/juan-6-47.png" alt="Juan 6:47"></dialog>
</body></html>
